# Companies to search. board_type is one of: greenhouse, lever, ashby.
# All tokens below were verified live against their public job-board APIs.
# Find a new company's token from its careers page URL, e.g.:
#   Greenhouse: https://boards.greenhouse.io/<token>            -> board_token: <token>
#   Lever:      https://jobs.lever.co/<token>                   -> board_token: <token>
#   Ashby:      https://jobs.ashbyhq.com/<token>                -> board_token: <token>
companies:
